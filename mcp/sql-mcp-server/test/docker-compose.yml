services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sqlmcp
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sqlmcp"]
      interval: 2s
      timeout: 3s
      retries: 20
  # MS SQL Server 2022, started by `npm run db:mssql:seed` (profile `mssql`, so `db:up` starts PostgreSQL alone).
  # It serves the test CA's certificate from `npm run db:mssql:certs` and refuses unencrypted connections.
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["mssql"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SqlMcp-Docker-Sa-2026!"
    ports:
      - "51433:1433"
    volumes:
      - ./mssql/certs/server.crt:/etc/ssl/sqlmcp/server.crt:ro
      - ./mssql/certs/server.key:/etc/ssl/sqlmcp/server.key:ro
      - ./mssql/mssql.conf:/var/opt/mssql/mssql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 3s
      timeout: 5s
      retries: 40
